  # ==========================================================
  # 7. MOTOR CUANTITATIVO F0
  # ==========================================================
  /quant/black-scholes:
    post:
      tags: [Cuantitativo F0]
      summary: Valuación analítica Black-Scholes y cálculo de 5 Griegas (F0)
      description: >
        Valida los parámetros antes de calcular. Admite números finitos y cadenas no vacías
        convertibles a números finitos. Precios, tiempo y volatilidad deben ser mayores que cero;
        la tasa puede ser cero o negativa. Conserva los valores predeterminados y admite campos
        adicionales. Datos inválidos o resultados no finitos producen 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotPrice, strikePrice, timeToExpirationYears]
              properties:
                spotPrice:
                  description: Número finito mayor que cero o cadena numérica equivalente.
                  oneOf:
                    - { type: number, minimum: 0, exclusiveMinimum: true }
                    - { type: string, minLength: 1 }
                  example: 565.0
                strikePrice:
                  description: Número finito mayor que cero o cadena numérica equivalente.
                  oneOf:
                    - { type: number, minimum: 0, exclusiveMinimum: true }
                    - { type: string, minLength: 1 }
                  example: 550.0
                timeToExpirationYears:
                  description: Número finito mayor que cero o cadena numérica equivalente.
                  oneOf:
                    - { type: number, minimum: 0, exclusiveMinimum: true }
                    - { type: string, minLength: 1 }
                  example: 0.08
                volatility:
                  description: Número finito mayor que cero o cadena numérica equivalente.
                  oneOf:
                    - { type: number, minimum: 0, exclusiveMinimum: true }
                    - { type: string, minLength: 1 }
                  default: 0.2
                  example: 0.15
                riskFreeRate:
                  description: Número finito de cualquier signo o cadena numérica equivalente.
                  oneOf:
                    - { type: number }
                    - { type: string, minLength: 1 }
                  default: 0.045
                  example: 0.045
                optionType:
                  type: string
                  description: CALL o PUT sin distinguir mayúsculas y minúsculas.
                  pattern: '^([Cc][Aa][Ll][Ll]|[Pp][Uu][Tt])$'
                  default: PUT
                  example: PUT
      responses:
        '200':
          description: Precio teórico y cinco griegas finitos, con el formato y precisión existentes.
        '400':
          description: Cuerpo, campo o rango numérico inválido; el mensaje identifica el problema.
          content:
            application/json:
              example:
                statusCode: 400
                error: Bad Request
                message: spotPrice debe ser un número finito.
                timestamp: '2026-11-06T12:00:00.000Z'
                path: /api/v1/quant/black-scholes
                activeDatabase: mongodb

  /quant/implied-volatility:
    post:
      tags: [Cuantitativo F0]
      summary: Cálculo iterativo de Volatilidad Implícita con Newton-Raphson (F0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketPrice, spotPrice, strikePrice, timeToExpirationYears, optionType]
              properties:
                marketPrice: { type: number, example: 6.50 }
                spotPrice: { type: number, example: 565.0 }
                strikePrice: { type: number, example: 550.0 }
                timeToExpirationYears: { type: number, example: 0.08 }
                optionType: { type: string, enum: [CALL, PUT], example: PUT }
      responses:
        '200':
          description: Volatilidad implícita calculada con convergencia

  # ==========================================================
  # 8. BROKERS BURSÁTILES: WEBULL OPENAPI & ALPACA MARKETS
  # ==========================================================
  /broker/account:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar balance, capital y poder de compra del broker activo
      description: >
        Disponible en v1 y v2. Con strict=true se requiere un token Bearer válido y el
        encabezado x-broker-selection. Este modo devuelve valores confirmados por el
        broker seleccionado. Si se omite strict, se aplica la modalidad habitual.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LecturaEstrictaBroker'
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
          description: Selección del broker para la consulta (por defecto WEBULL)
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
          description: Selección alternativa de broker por parámetro query
      responses:
        '200':
          description: Objeto de cuenta habitual o respuesta de cuenta confirmada cuando strict=true.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    not: { required: [account] }
                  - $ref: '#/components/schemas/CuentaBrokerConfirmada'
        '400':
          description: Selección de broker ausente o inválida en modo estricto.
        '401':
          description: Token inválido o sesión ausente en modo estricto.
        '502':
          description: Respuesta del broker ilegible, o sin efectivo, valor del portafolio o Buying Power (también sin strict; no se usan saldos supuestos).
        '503':
          description: El broker no respondió.

  /broker/positions:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar posiciones vivas abiertas en el broker activo
      description: >
        Disponible en v1 y v2. Con strict=true se requiere un token Bearer válido y el
        encabezado x-broker-selection. Un arreglo vacío en el campo positions indica una
        lectura exitosa sin posiciones abiertas. Si se omite strict, se devuelve el arreglo habitual.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LecturaEstrictaBroker'
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      responses:
        '200':
          description: Arreglo habitual o respuesta de posiciones confirmadas cuando strict=true.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/BrokerPosition' }
                  - $ref: '#/components/schemas/PosicionesBrokerConfirmadas'
        '400':
          description: Selección de broker ausente o inválida en modo estricto.
        '401':
          description: Token inválido o sesión ausente en modo estricto.
        '502':
          description: Respuesta del broker ilegible.
        '503':
          description: El broker no respondió; no se devuelve una lista vacía (también sin strict).

  /broker/orders:
    get:
      tags: [Brokers Bursátiles]
      summary: Listar órdenes bursátiles ejecutadas o pendientes en el broker
      parameters:
        - in: query
          name: status
          schema: { type: string, default: all }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      responses:
        '200':
          description: Órdenes reportadas por el broker; un arreglo vacío significa que el broker confirmó que no hay órdenes
        '502':
          description: Respuesta del broker ilegible
        '503':
          description: El broker no respondió; no se devuelve una lista vacía
    post:
      tags: [Brokers Bursátiles]
      summary: Emitir una nueva orden bursátil (mercado/límite) en Webull, Alpaca o IBKR con verificación estricta de tenencia y Buying Power
      parameters:
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerOrderInput'
      responses:
        '201':
          description: El broker devolvió un identificador de orden; estado y cantidad ejecutada son los que reporta o null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrokerOrderOutput' }
        '400':
          description: >
            Orden incompleta (no se envía al broker), venta mayor a las acciones reportadas (los contratos de opciones
            no cuentan), costo estimado mayor al Buying Power (en market, con el ask observado) o rechazo del broker con su mensaje literal
        '502':
          description: El broker respondió sin identificador de orden, o no informó la tenencia o el saldo
        '503':
          description: El broker no respondió, o no se pudo leer la cuenta, la cotización o las posiciones necesarias para validar la orden

  /broker/orders/{id}:
    delete:
      tags: [Brokers Bursátiles]
      summary: Cancelar una orden bursátil abierta en el broker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      responses:
        '200':
          description: El broker confirmó la cancelación
        '202':
          description: IBKR recibió la cancelación y TWS aún la procesa (estado PendingCancel); incluye `pending: true` y el estado informado
        '400':
          description: El broker rechazó la cancelación (por ejemplo, una orden ya ejecutada); incluye su mensaje
        '502':
          description: El broker no confirmó el estado de la cancelación
        '503':
          description: El broker no respondió

  /broker/quote/{symbol}:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar cotización viva en tiempo real desde Webull o Alpaca
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: AAPL }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      responses:
        '200':
          description: Cotización reportada; bid, ask, tamaños y nombre de empresa quedan en null si el broker no los informa (no se derivan del último precio)
        '502':
          description: El broker no informó un precio
        '503':
          description: El broker no respondió

  /broker/options-chain/{symbol}:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar cadena de opciones viva (Option Chain) para calibración de coberturas
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: SPY }
        - in: query
          name: expiration
          schema: { type: string, example: '2026-10-16' }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      description: >
        La misma cadena real para los tres brokers: contratos listados de Alpaca con cotizaciones de Webull OpenAPI.
        Se descartan cotizaciones con más de 15 minutos de retraso o fuera de la sesión. No se generan strikes ni primas.
      responses:
        '200':
          description: Contratos Call y Put cotizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  broker: { type: string }
                  symbol: { type: string }
                  spotPrice: { type: number }
                  spotTime: { type: string, nullable: true }
                  expirations: { type: array, items: { type: string, format: date } }
                  source: { type: string }
                  calls: { type: array, items: { $ref: '#/components/schemas/ContratoOpcionCotizado' } }
                  puts: { type: array, items: { $ref: '#/components/schemas/ContratoOpcionCotizado' } }
        '400':
          description: Vencimiento inválido o pasado
        '503':
          description: No hay contratos cotizados (o del vencimiento pedido) o el proveedor no respondió

  /broker/sync-underlying/{symbol}:
    post:
      tags: [Brokers Bursátiles]
      summary: Sincronizar y actualizar precio spot del subyacente en BD con datos del Broker
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: GOOGL }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase], default: mongodb }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      responses:
        '200':
          description: Subyacente sincronizado en la base de datos seleccionada con el broker activo

  # ==========================================================
  # 9. SCREENER CUANTITATIVO & TRADINGVIEW (API v2)
  # ==========================================================
  /strategy-screener/run:
    servers:
      - url: http://localhost:3050/api/v2
        description: API v2 local
      - url: https://lsw-eq1-proyecto.onrender.com/api/v2
        description: API v2 de Render
    post:
      tags: [Screener & TradingView]
      operationId: runStrategyScreener
      summary: Analizar candidatos para Collar Spread con los cores seleccionados
      description: Consulta informativa basada en observaciones de mercado y publicaciones verificables.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyScreenerCriteria'
            example: { mode: BY_STRATEGY, strategy: COLLAR_SPREAD, activeCores: ['001', '006'], limit: 5, dteHorizon: 45 }
      responses:
        '200':
          description: Análisis completo o parcial con diagnósticos y exclusiones por activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyScreenerResult'
        '400':
          description: Modo, estrategia, selección o filtros inválidos
        '401':
          description: La consulta requiere una sesión válida
        '503':
          description: Las fuentes disponibles son insuficientes para evaluar los activos

  /strategy-screener/ai-analysis:
    servers:
      - url: http://localhost:3050/api/v2
        description: API v2 local
      - url: https://lsw-eq1-proyecto.onrender.com/api/v2
        description: API v2 de Render
    post:
      tags: [Screener & TradingView]
      operationId: analyzeCollarWithAi
      summary: Consultar oportunidades de Collar Spread con el Core de IA
      description: >
        Consulta informativa basada en el escáner de mercado. Compara hasta diez empresas
        evaluables para sugerir hasta tres candidatas de mejor a menor ajuste o evalúa un único
        ticker. Los motivos breves y los riesgos relevantes pueden citar observaciones del
        escáner o aportar contexto general.
        La lista de riesgos puede estar vacía. Usa un límite de 12 consultas al modelo
        por minuto en cada proceso. El proveedor predeterminado es Gemini 3.1 Flash-Lite.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollarAiCriteria'
            examples:
              sugerencias:
                value: { scope: CANDIDATES, activeCores: ['001', '002', '006'], dteHorizon: 45 }
              empresa:
                value: { scope: SYMBOL, symbol: AAPL, activeCores: ['001', '002', '006'], dteHorizon: 45 }
      responses:
        '200':
          description: Veredicto, sugerencias o causa de datos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollarAiResult'
        '400':
          description: Alcance, ticker, selección o filtros inválidos
        '401':
          description: La consulta requiere una sesión válida
        '429':
          description: Se alcanzó el límite temporal del servicio o la cuota del proveedor de IA
        '502':
          description: Respuesta del modelo incompleta, inválida o con referencias ajenas a la evidencia suministrada
        '503':
          description: Core de IA sin configurar o fuentes de mercado o IA indisponibles

  /strategy-screener/technical/{symbol}:
    servers:
      - url: http://localhost:3050/api/v2
        description: API v2 local
      - url: https://lsw-eq1-proyecto.onrender.com/api/v2
        description: API v2 de Render
    get:
      tags: [Screener & TradingView]
      operationId: getTechnicalSeries
      summary: Serie técnica del Core 001 para la gráfica
      description: >
        Velas diarias cerradas de dos años con las medias móviles, las bandas de soporte y resistencia,
        los tramos de tendencia y la proyección del Core 001. Usa las mismas velas y cálculos que el ranking,
        no requiere evaluar los cores y guarda el resultado 90 s. Es de solo lectura.
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z]{1,5}([.-][A-Za-z]{1,2})?$'
          example: AAPL
          description: Símbolo de la acción; se normaliza a mayúsculas
      responses:
        '200':
          description: Serie técnica con su fuente e instante de corte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalSeries'
        '400':
          description: Símbolo inválido
        '401':
          description: La consulta requiere una sesión válida
        '503':
          description: La fuente no entregó velas suficientes; el mensaje indica la causa y no se entregan datos supuestos

  /market/scanner/top-collars:
    get:
      tags: [Screener & TradingView]
      summary: Escaneo y ranking de las 5 o 10 mejores empresas para Collar Spreads
      description: >
        Evalúa la canasta de mercado calculando la probabilidad estocástica de piso seguro N(d2),
        el balance de primas a costo cero y el retorno potencial para diferentes horizontes temporales.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 25
          description: Cantidad de activos a retornar en el ranking
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [probability, netCredit, maxReturn]
            default: probability
          description: Criterio principal de ordenamiento del ranking
        - name: dteHorizon
          in: query
          schema:
            type: integer
            enum: [30, 45, 60]
            default: 45
          description: Horizonte de vencimiento en días (Days To Expiration)
        - name: broker
          in: query
          schema:
            type: string
            enum: [IBKR, ALPACA, WEBULL]
          description: Broker bursátil para cotizaciones vivas
      responses:
        '200':
          description: >
            Ranking teórico. BREAKING: marketPremium se llama ahora theoreticalPremium, se agrega pricing y se retiran
            technicalOutlook, technicalSummary, rsi14 y aboveSma200. Los activos sin cotización del broker no reciben
            un precio de referencia: van a unavailable con el motivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp: { type: string, format: date-time }
                  criteria: { type: object }
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/CandidatoEscanerTeorico' }
                  unavailable:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        reason: { type: string }
        '400':
          description: Parámetro de consulta inválido
        '503':
          description: El broker no entregó la cotización de ningún activo; no se usan precios de referencia

  /market/scanner/company-criteria:
    get:
      tags: [Screener & TradingView]
      summary: Protocolo oficial y criterios cuantitativos de admisión de empresas
      description: Retorna los 4 pilares obligatorios (Tendencia técnica, Liquidez, Volatilidad y Calendario corporativo).
      responses:
        '200':
          description: Criterios y umbrales normativos

  /market/scanner/tradingview/{symbol}:
    get:
      tags: [Screener & TradingView]
      summary: Configuración y metadatos para widgets de TradingView
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: NVDA
          description: Ticker del activo (ej. AAPL, NVDA)
      responses:
        '200':
          description: Parámetros del gráfico y velocímetro de análisis técnico

components:
  parameters:
    LecturaEstrictaBroker:
      in: query
      name: strict
      schema: { type: boolean, default: false }
      description: Activa la lectura confirmada para Portafolio y requiere Bearer JWT y x-broker-selection.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer JWT emitido en /auth/login con claims de usuario, rol y motor de base de datos activa (dbTarget).

  schemas:
    StrategyScreenerCriteria:
      type: object
      additionalProperties: true
      required: [mode, strategy, activeCores]
      properties:
        mode: { type: string, enum: [BY_STRATEGY] }
        strategy: { type: string, enum: [COLLAR_SPREAD] }
        activeCores:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: ['001', '002', '003', '005', '006'] }
        limit: { type: integer, minimum: 1, maximum: 25, default: 5 }
        dteHorizon: { type: integer, enum: [30, 45, 60], default: 45 }
        extraSymbols:
          type: array
          items: { type: string }
          description: Tickers adicionales personalizados añadidos por el usuario para análisis multi-core
        broker:
          type: string
          enum: [WEBULL, ALPACA, IBKR]
          description: Contexto opcional del broker rector
        databaseTarget:
          type: string
          enum: [mongodb, supabase]
          description: Contexto opcional del motor de persistencia activo
    CollarAiCriteria:
      type: object
      additionalProperties: false
      required: [scope, activeCores]
      properties:
        scope: { type: string, enum: [CANDIDATES, SYMBOL] }
        symbol: { type: string, pattern: '^[A-Za-z]{1,5}([.-][A-Za-z]{1,2})?$' }
        activeCores:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: ['001', '002', '003', '005', '006'] }
        dteHorizon: { type: integer, enum: [30, 45, 60], default: 45 }
        extraSymbols:
          type: array
          maxItems: 25
          items: { type: string, pattern: '^[A-Za-z]{1,5}([.-][A-Za-z]{1,2})?$' }
      oneOf:
        - properties:
            scope: { type: string, enum: [CANDIDATES] }
          not: { required: [symbol] }
        - properties:
            scope: { type: string, enum: [SYMBOL] }
          required: [symbol]
          not: { required: [extraSymbols] }
    CollarAiResult:
      type: object
      required: [scope, strategy, dteHorizon, asOf, model, status, message, recommendations]
      properties:
        scope: { type: string, enum: [CANDIDATES, SYMBOL] }
        strategy: { type: string, enum: [COLLAR_SPREAD] }
        dteHorizon: { type: integer, enum: [30, 45, 60] }
        asOf: { type: string, format: date-time }
        model: { type: string, nullable: true }
        status: { type: string, enum: [COMPLETE, NO_SUGGESTIONS, INSUFFICIENT_DATA] }
        message: { type: string, nullable: true }
        recommendations:
          type: array
          maxItems: 3
          items:
            type: object
            required: [symbol, verdict, reasons, risks, evidence]
            properties:
              symbol: { type: string, example: AAPL }
              verdict: { type: string, enum: [CONSIDER, AVOID, WAIT, INSUFFICIENT_DATA] }
              reasons:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  $ref: '#/components/schemas/CollarAiPoint'
              risks:
                type: array
                maxItems: 2
                items:
                  $ref: '#/components/schemas/CollarAiPoint'
              evidence:
                type: array
                items:
                  type: object
                  required: [id, label, detail, status, sources]
                  properties:
                    id: { type: string, example: AAPL/collar }
                    label: { type: string }
                    detail: { type: string }
                    status: { type: string, enum: [AVAILABLE, PARTIAL] }
                    sources:
                      type: array
                      items:
                        type: object
                        required: [source, observedAt, reference]
                        properties:
                          source: { type: string }
                          observedAt: { type: string, description: Fecha o instante ISO de la observación }
                          reference: { type: string, nullable: true }
    CollarAiPoint:
      type: object
      required: [text, evidenceId]
      properties:
        text: { type: string }
        evidenceId:
          type: string
          nullable: true
          description: Identificador de evidencia o null para contexto general o una causa sin observación adjunta
    StrategyScreenerResult:
      type: object
      required: [asOf, criteria, status, candidates, excluded]
      properties:
        asOf: { type: string, format: date-time }
        criteria:
          $ref: '#/components/schemas/StrategyScreenerCriteria'
        status: { type: string, enum: [COMPLETE, PARTIAL] }
        candidates:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/StrategyScreenerAsset'
              - type: object
                required: [rank, score]
                properties:
                  rank: { type: integer, minimum: 1 }
                  score: { type: number, minimum: 0, maximum: 100 }
        excluded:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/StrategyScreenerAsset'
              - type: object
                required: [reason, exclusionType]
                properties:
                  reason: { type: string }
                  exclusionType:
                    type: string
                    enum: [VIABILITY_VETO, NO_COLLAR, INSUFFICIENT_DATA]
                    description: >
                      VIABILITY_VETO: clasificada como MARGINAL o NO_VIABLE. NO_COLLAR: el Core 004 no encontró
                      un par Put/Call líquido y compatible. INSUFFICIENT_DATA: faltaron datos de elegibilidad,
                      de la cadena o de un core seleccionado.
    StrategyScreenerAsset:
      type: object
      required: [symbol, companyName, eligibility, cores]
      properties:
        symbol: { type: string }
        companyName: { type: string }
        eligibility: { type: string, enum: [VIABLE, MARGINAL, NO_VIABLE, UNKNOWN] }
        partial:
          type: boolean
          description: >
            Solo en candidates. true si algún core seleccionado quedó parcial o si el riesgo de eventos es UNVERIFIED
            (el calendario de resultados no entregó una fecha; no se estima ninguna). En ese caso el Core 002 conserva su
            puntaje con estado PARTIAL y result.risk UNVERIFIED (result.event.reason con la causa), y el Core 003 se
            abstiene con signal HOLD y rule EVENT_UNVERIFIED.
        cores:
          type: object
          required: ['001', '002', '003', '004', '005', '006', '007']
          additionalProperties:
            $ref: '#/components/schemas/StrategyCoreDiagnostic'
    StrategyCoreDiagnostic:
      type: object
      required: [status, result, evidence]
      properties:
        status: { type: string, enum: [AVAILABLE, PARTIAL, UNAVAILABLE, NOT_SELECTED] }
        active: { type: boolean }
        reason: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        role:
          type: string
          enum: [CONFLUENCE, GATE, DEPENDENCY, SYNTHESIS, NOT_COMPUTED]
          description: >
            Participación del core para la empresa. CONFLUENCE: seleccionado y ponderado en la confluencia.
            GATE: filtro sin ponderar (Fundamental no seleccionado como veto de viabilidad y Estrategia 004).
            DEPENDENCY: calculado solo porque otro core seleccionado lo requiere (Técnico para Señales directas).
            SYNTHESIS: Confluencia 007. NOT_COMPUTED: no se calculó.
        effectiveWeight:
          type: number
          minimum: 0
          maximum: 1
          example: 0.225
          description: Peso normalizado que aplicó la confluencia; solo con role CONFLUENCE y cuando la confluencia tiene puntaje.
        result:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Indicadores y resultado específico del core. El Core 001 sigue TechnicalCoreResult.
            El Core 006 incluye headlines para el puntaje de 7 días, contextObserved para el conteo de titulares
            en hasta 15 días y events con los hechos de contexto. Cada evento puede incluir event.type, event.action,
            event.state, contextOnly, timeSource, related y reaction. reaction usa la primera sesión regular elegible,
            con status AVAILABLE, PENDING o UNAVAILABLE. Cuando está disponible incluye sessionChange, openingGap
            si la publicación precede a la apertura, relativeVolume y benchmark con la diferencia en puntos porcentuales.
            La reacción es evidencia informativa y el puntaje procede de las publicaciones.
        evidence:
          type: array
          items:
            type: object
            required: [source, observedAt, reference, delayMinutes]
            properties:
              source: { type: string }
              observedAt: { type: string, nullable: true }
              reference: { type: string, nullable: true }
              delayMinutes: { type: number, minimum: 0 }
    TechnicalCoreLevel:
      type: object
      required: [price, touches, lastTouch, score, distancePct]
      properties:
        price: { type: number, example: 339.45 }
        touches: { type: integer, minimum: 1, example: 3 }
        lastTouch: { type: string, format: date, example: '2026-11-06' }
        score: { type: number, minimum: 0, maximum: 100, example: 68.94, description: 'Puntaje por toques (40 %), antigüedad (25 %), volumen cercano (20 %) y proximidad al precio (15 %)' }
        distancePct: { type: number, example: -1.15, description: Distancia porcentual al último cierre; negativa en soportes }
    TechnicalCoreScale:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        direction: { type: string, enum: [UP, DOWN, SIDEWAYS] }
        since: { type: string, format: date, description: Fecha de confirmación de la tendencia vigente (cruce que se mantuvo al menos 3 sesiones) }
        sessions: { type: integer, minimum: 1 }
        reason: { type: string, description: Causa cuando la escala no está disponible }
    TechnicalCoreSegment:
      type: object
      required: [direction, start, end, sessions, changePct]
      properties:
        direction: { type: string, enum: [UP, DOWN, SIDEWAYS] }
        start: { type: string, format: date }
        end: { type: string, format: date }
        sessions: { type: integer, minimum: 1 }
        changePct: { type: number }
    TechnicalCoreProjection:
      type: object
      required: [available]
      description: Extrapolación informativa del cruce de medias; no entra al puntaje del Core 001 ni a la confluencia y nunca se expresa como un día exacto.
      properties:
        available: { type: boolean }
        projected: { type: boolean }
        direction: { type: string, enum: [UP, DOWN] }
        window:
          type: object
          nullable: true
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        sessions:
          type: object
          properties:
            from: { type: integer, minimum: 1 }
            to: { type: integer, maximum: 60 }
        openEnded: { type: boolean }
        reason: { type: string }
        windowReason: { type: string }
        assumption: { type: string }
        accuracy:
          type: object
          properties:
            cases: { type: integer, minimum: 0 }
            hitRate: { type: number, nullable: true, minimum: 0, maximum: 1 }
            meanErrorSessions: { type: number, nullable: true }
            insufficientSample: { type: boolean }
    TechnicalCoreResult:
      type: object
      description: Resultado del Core 001 calculado con velas diarias de dos años y marcos de 1 hora y 15 minutos.
      properties:
        trend: { type: string, enum: [UP, DOWN, SIDEWAYS] }
        bias: { type: number, minimum: -100, maximum: 100 }
        support: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/TechnicalCoreLevel' } }
        resistance: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/TechnicalCoreLevel' } }
        scales:
          type: object
          properties:
            primary: { $ref: '#/components/schemas/TechnicalCoreScale' }
            intermediate: { $ref: '#/components/schemas/TechnicalCoreScale' }
            short: { $ref: '#/components/schemas/TechnicalCoreScale' }
        segments:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/TechnicalCoreSegment' }
        projections:
          type: object
          properties:
            intermediate: { $ref: '#/components/schemas/TechnicalCoreProjection' }
            short: { $ref: '#/components/schemas/TechnicalCoreProjection' }
        indicators:
          type: object
          properties:
            rsi:
              type: object
              properties:
                value: { type: number }
                zone: { type: string, enum: [OVERSOLD, NEUTRAL, OVERBOUGHT] }
            macd:
              type: object
              properties:
                line: { type: number }
                signal: { type: number }
                histogram: { type: number }
                lastCross:
                  type: object
                  nullable: true
                  properties:
                    type: { type: string, enum: [BULLISH, BEARISH] }
                    date: { type: string, format: date }
            adx:
              type: object
              properties:
                value: { type: number }
                plusDI: { type: number }
                minusDI: { type: number }
                class: { type: string, enum: [NO_TREND, WEAK, STRONG, VERY_STRONG] }
            bollinger:
              type: object
              properties:
                lower: { type: number }
                middle: { type: number }
                upper: { type: number }
                width: { type: number }
    TechnicalSeriesPoint:
      type: object
      required: [time, value]
      properties:
        time: { type: string, format: date }
        value: { type: number }
    TechnicalSeriesLevel:
      allOf:
        - $ref: '#/components/schemas/TechnicalCoreLevel'
        - type: object
          required: [lower, upper]
          properties:
            lower: { type: number, description: Límite inferior de la banda (precio menos la tolerancia con que se agruparon los toques) }
            upper: { type: number, description: Límite superior de la banda }
    TechnicalSeries:
      type: object
      required: [symbol, asOf, cutoff, lastSession, source, candles, movingAverages, support, resistance, scales, segments, projections, upcoming, evidence]
      properties:
        symbol: { type: string, example: AAPL }
        asOf: { type: string, format: date-time }
        cutoff: { type: string, format: date-time, description: Instante de corte de los datos de mercado }
        lastSession: { type: string, format: date, description: Última sesión cerrada incluida en las velas }
        source: { type: string, example: Alpaca Market Data IEX }
        candles:
          type: array
          description: Velas diarias cerradas de los dos años que usa el Core 001
          items:
            type: object
            required: [time, open, high, low, close, volume]
            properties:
              time: { type: string, format: date }
              open: { type: number }
              high: { type: number }
              low: { type: number }
              close: { type: number }
              volume: { type: number }
        movingAverages:
          type: object
          description: Medias alineadas con las velas; empiezan cuando hay periodo completo
          properties:
            sma200: { type: array, items: { $ref: '#/components/schemas/TechnicalSeriesPoint' } }
            ema50: { type: array, items: { $ref: '#/components/schemas/TechnicalSeriesPoint' } }
            ema20: { type: array, items: { $ref: '#/components/schemas/TechnicalSeriesPoint' } }
        support: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/TechnicalSeriesLevel' } }
        resistance: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/TechnicalSeriesLevel' } }
        scales: { $ref: '#/components/schemas/TechnicalCoreResult/properties/scales' }
        segments: { $ref: '#/components/schemas/TechnicalCoreResult/properties/segments' }
        projections: { $ref: '#/components/schemas/TechnicalCoreResult/properties/projections' }
        upcoming:
          type: array
          maxItems: 60
          description: Sesiones bursátiles futuras del calendario de Alpaca, usadas para fechar la ventana proyectada
          items: { type: string, format: date }
        limitation: { type: string }
        evidence: { $ref: '#/components/schemas/StrategyCoreDiagnostic/properties/evidence' }
    CuentaBrokerConfirmada:
      type: object
      required: [broker, account]
      properties:
        broker: { type: string, enum: [WEBULL, ALPACA, IBKR] }
        account:
          type: object
          required: [currency, cash, portfolioValue, buyingPower]
          properties:
            currency: { type: string, nullable: true, example: USD }
            cash: { type: number, nullable: true, example: 0 }
            portfolioValue: { type: number, nullable: true }
            buyingPower: { type: number, nullable: true }
            source: { type: string, nullable: true, example: Alpaca (paper trading) }

    PosicionesBrokerConfirmadas:
      type: object
      required: [broker, positions]
      properties:
        broker: { type: string, enum: [WEBULL, ALPACA, IBKR] }
        positions:
          type: array
          items:
            type: object
            required: [assetId, symbol, qty, side]
            description: La posición contiene al menos un identificador de instrumento o símbolo.
            properties:
              assetId: { type: string, nullable: true }
              symbol: { type: string, nullable: true, example: AAPL }
              qty: { type: number, example: 10 }
              side: { type: string, nullable: true, enum: [long, short, null] }

    UnderlyingInput:
      type: object
      required: [symbol, companyName, spotPrice]
      properties:
        symbol: { type: string, example: NVDA }
        companyName: { type: string, example: NVIDIA Corporation }
        spotPrice: { type: number, example: 125.80 }
        volatility: { type: number, example: 0.45 }

    Underlying:
      type: object
      required: [symbol, companyName, spotPrice, volatility]
      properties:
        id: { type: string, example: '67035ab218ef8c12e4f09999' }
        symbol: { type: string, example: AAPL }
        companyName: { type: string, example: Apple Inc. }
        spotPrice: { type: number, example: 228.52 }
        volatility: { type: number, example: 0.2450 }
        createdAt: { type: string, format: date-time, example: '2026-10-10T12:00:00Z' }
        updatedAt: { type: string, format: date-time, example: '2026-10-10T14:30:00Z' }

    LegInput:
      type: object
      required: [legRole, assetType, quantity, entryPrice]
      properties:
        legRole: { type: string, enum: [UNDERLYING, HEDGE_FLOOR, FINANCE_CEILING, STOCK, LONG_PUT, SHORT_CALL], example: HEDGE_FLOOR }
        assetType: { type: string, enum: [EQUITY, OPTION], example: OPTION }
        optionType: { type: string, enum: [CALL, PUT, null], example: PUT }
        strike: { type: number, example: 220.0 }
        quantity: { type: integer, example: 1 }
        entryPrice: { type: number, example: 4.20 }

    OptionLeg:
      type: object
      required: [legId, legRole, assetType, quantity, entryPrice]
      properties:
        legId: { type: string, example: 'LEG-PUT-FLOOR-01' }
        legRole:
          type: string
          enum: [UNDERLYING, HEDGE_FLOOR, FINANCE_CEILING, STOCK, LONG_PUT, SHORT_CALL]
          example: HEDGE_FLOOR
        assetType:
          type: string
          enum: [EQUITY, OPTION]
          example: OPTION
        contractSymbol: { type: string, example: 'NVDA261016P00119500' }
        optionType:
          type: string
          enum: [CALL, PUT, null]
          example: PUT
        strike: { type: number, example: 119.50 }
        expirationDate: { type: string, format: date-time, example: '2026-10-16T00:00:00Z' }
        quantity: { type: integer, example: 1 }
        entryPrice: { type: number, example: 2.15 }
        delta: { type: number, example: -0.2105 }
        gamma: { type: number, example: 0.0340 }
        theta: { type: number, example: -0.0450 }
        vega: { type: number, example: 0.1250 }

    UnderlyingSubdocument:
      type: object
      required: [symbol, companyName, spotPriceAtEntry, sharesCount]
      properties:
        symbol: { type: string, example: NVDA }
        companyName: { type: string, example: NVIDIA Corporation }
        spotPriceAtEntry: { type: number, example: 125.80 }
        sharesCount: { type: integer, example: 100 }

    FinancialMetricsSubdocument:
      type: object
      required: [netDebitCredit, breakevenPrice, floorProtectionPrice, maxLossTotalUSD]
      properties:
        netDebitCredit: { type: number, example: 3.00, description: 'Crédito (+) o Débito (-) neto en USD de primas' }
        breakevenPrice: { type: number, example: 125.77, description: 'Precio de equilibrio a vencimiento' }
        floorProtectionPrice: { type: number, example: 119.50, description: 'Suelo mínimo blindado garantizado por el Put' }
        ceilingCapPrice: { type: number, example: 135.00, description: 'Techo máximo de ganancias fijado por el Short Call' }
        maxLossTotalUSD: { type: number, example: 627.00, description: 'Pérdida máxima acotada en USD' }
        maxProfitTotalUSD: { type: number, example: 923.00, description: 'Beneficio máximo acotado en USD' }
        netDelta: { type: number, example: 0.5655, description: 'Delta neta agregada de la posición cubierta' }

    HedgingStrategy:
      type: object
      required: [_id, portfolioId, broker, strategyType, status, underlying, legs, financialMetrics]
      properties:
        _id: { type: string, example: '67035ab218ef8c12e4f01234' }
        id: { type: string, example: '67035ab218ef8c12e4f01234' }
        portfolioId:
          type: string
          example: 'PORT-TECH-COLLAR-01'
          description: "Texto libre en MongoDB. En Supabase debe ser un UUID o 'PORT-01' (portafolio por defecto); otro valor responde 400, y en coberturas ejecutadas se rechaza antes de emitir órdenes."
        broker:
          type: string
          enum: [ALPACA, IBKR, WEBULL]
          default: ALPACA
          example: ALPACA
          description: Broker bursátil donde opera o se liquida la estrategia de cobertura
        strategyType:
          type: string
          enum: [PROTECTIVE_PUT, COLLAR, COLLAR_SPREAD]
          example: COLLAR
        status:
          type: string
          enum: [ACTIVE, CLOSED, EXPIRED, EXERCISED]
          default: ACTIVE
          example: ACTIVE
        underlying:
          $ref: '#/components/schemas/UnderlyingSubdocument'
        legs:
          type: array
          items:
            $ref: '#/components/schemas/OptionLeg'
        financialMetrics:
          $ref: '#/components/schemas/FinancialMetricsSubdocument'
        createdAt: { type: string, format: date-time, example: '2026-10-10T14:30:00Z' }
        updatedAt: { type: string, format: date-time, example: '2026-10-10T14:30:00Z' }

    BlackScholesInput:
      type: object
      required: [spotPrice, strikePrice, timeToExpirationYears, volatility, riskFreeRate, optionType]
      properties:
        spotPrice: { type: number, example: 228.50 }
        strikePrice: { type: number, example: 220.00 }
        timeToExpirationYears: { type: number, example: 0.0822 }
        volatility: { type: number, example: 0.25 }
        riskFreeRate: { type: number, example: 0.045 }
        optionType: { type: string, enum: [CALL, PUT], example: PUT }

    BlackScholesOutput:
      type: object
      properties:
        theoreticalPrice: { type: number, example: 2.15 }
        d1: { type: number, example: 0.6543 }
        d2: { type: number, example: 0.5824 }
        greeks:
          type: object
          properties:
            delta: { type: number, example: -0.2105 }
            gamma: { type: number, example: 0.0340 }
            theta: { type: number, example: -0.0450 }
            vega: { type: number, example: 0.1250 }
            rho: { type: number, example: -0.0150 }

    ImpliedVolatilityInput:
      type: object
      required: [marketPrice, spotPrice, strikePrice, timeToExpirationYears, riskFreeRate, optionType]
      properties:
        marketPrice: { type: number, example: 2.15 }
        spotPrice: { type: number, example: 228.50 }
        strikePrice: { type: number, example: 220.00 }
        timeToExpirationYears: { type: number, example: 0.0822 }
        riskFreeRate: { type: number, example: 0.045 }
        optionType: { type: string, enum: [CALL, PUT], example: PUT }

    ImpliedVolatilityOutput:
      type: object
      properties:
        impliedVolatility: { type: number, example: 0.2485 }
        iterations: { type: integer, example: 3 }
        converged: { type: boolean, example: true }

    BrokerOrderInput:
      type: object
      description: >
        La orden se rechaza con 400 antes de contactar al broker si falta un dato. No hay precios, strikes,
        vencimientos ni tipos por defecto; las órdenes market se envían sin precio límite.
      required: [symbol, instrumentType, qty, side, type]
      properties:
        broker: { type: string, enum: [WEBULL, ALPACA, IBKR], example: WEBULL }
        symbol: { type: string, example: AAPL, description: Subyacente; en opciones puede deducirse de contractSymbol }
        instrumentType: { type: string, enum: [EQUITY, OPTION], example: OPTION }
        contractSymbol: { type: string, example: AAPL261218P00300000, description: Símbolo OCC; debe coincidir con optionType, strikePrice y expirationDate si se envían }
        optionType: { type: string, enum: [CALL, PUT], description: 'Obligatorio en opciones (o en contractSymbol)', example: PUT }
        strikePrice: { type: number, description: 'Obligatorio en opciones (o en contractSymbol)', example: 300 }
        expirationDate: { type: string, format: date, description: 'Obligatorio en opciones (o en contractSymbol)', example: '2026-12-18' }
        strategy: { type: string, enum: [SINGLE, COVERED_STOCK], default: SINGLE, description: Solo opciones en Webull }
        stockPrice: { type: number, description: Obligatorio con strategy COVERED_STOCK }
        qty: { type: integer, minimum: 1, example: 1 }
        side: { type: string, enum: [buy, sell], example: buy }
        type: { type: string, enum: [market, limit], example: limit }
        timeInForce: { type: string, enum: [day, gtc], default: day }
        limitPrice: { type: number, exclusiveMinimum: 0, description: Obligatorio en órdenes limit; se ignora en market, example: 2.15 }

    BrokerOrderOutput:
      type: object
      required: [message, order]
      properties:
        message: { type: string, description: Describe la orden como enviada o aceptada; no como ejecutada mientras el broker no informe el llenado }
        order:
          type: object
          required: [broker, id]
          properties:
            broker: { type: string, enum: [WEBULL, ALPACA, IBKR] }
            id: { type: string, description: Identificador que devolvió el broker }
            clientOrderId: { type: string, nullable: true }
            symbol: { type: string }
            instrumentType: { type: string, enum: [EQUITY, OPTION] }
            contractSymbol: { type: string, nullable: true }
            optionType: { type: string, nullable: true }
            strikePrice: { type: number, nullable: true }
            expirationDate: { type: string, nullable: true }
            qty: { type: integer }
            side: { type: string }
            type: { type: string }
            limitPrice: { type: number, nullable: true }
            status: { type: string, nullable: true, description: Estado reportado por el broker; null si no lo reporta }
            filledQty: { type: number, nullable: true, description: Cantidad ejecutada reportada por el broker; null si no la reporta }
            createdAt: { type: string, nullable: true }

    CandidatoEscanerTeorico:
      type: object
      description: Collar teórico (Black-Scholes) sobre el precio observado; sus primas no son cotizaciones ni precios de órdenes.
      properties:
        rank: { type: integer }
        symbol: { type: string }
        companyName: { type: string, nullable: true }
        spotPrice: { type: number, description: Precio observado en el broker }
        spotObservedAt: { type: string, nullable: true }
        spotSource: { type: string, nullable: true }
        optimalExpiration: { type: string, format: date }
        dteDays: { type: integer }
        pricing:
          type: object
          properties:
            model: { type: string, enum: [BLACK_SCHOLES] }
            theoretical: { type: boolean, enum: [true] }
            volatility: { type: number }
            volatilitySource: { type: string, description: Origen de la volatilidad supuesta (referencia de la canasta o valor declarado) }
            riskFreeRate: { type: number, example: 0.045 }
        putFloor:
          type: object
          properties:
            strike: { type: number }
            theoreticalPremium: { type: number }
            delta: { type: number }
            moneyness: { type: string }
        callCeiling:
          type: object
          properties:
            strike: { type: number }
            theoreticalPremium: { type: number }
            delta: { type: number }
            moneyness: { type: string }
        financialMetrics: { type: object }
        probabilities: { type: object }
        tradingViewSymbol: { type: string }
    ContratoOpcionCotizado:
      type: object
      properties:
        contractSymbol: { type: string, example: AAPL270108P00325000 }
        type: { type: string, enum: [PUT, CALL] }
        strike: { type: number }
        expirationDate: { type: string, format: date }
        multiplier: { type: number, example: 100 }
        bid: { type: number, nullable: true }
        ask: { type: number, nullable: true }
        volume: { type: number, nullable: true }
        openInterest: { type: number, nullable: true }
        quoteTime: { type: string, format: date-time, nullable: true }
        delayMinutes: { type: number }
        source: { type: string }
        spreadPct: { type: number }
    VistaPreviaCollar:
      type: object
      properties:
        symbol: { type: string }
        underlying:
          type: object
          properties:
            price: { type: number }
            quoteTime: { type: string, nullable: true }
            source: { type: string }
        put: { $ref: '#/components/schemas/ContratoOpcionCotizado' }
        call: { $ref: '#/components/schemas/ContratoOpcionCotizado' }
        metrics:
          type: object
          properties:
            shares: { type: number }
            netPremiumPerShare: { type: number, description: 'ask del Put − bid del Call; positivo es débito' }
            netCost: { type: string, enum: [DEBIT, CREDIT, ZERO] }
            maxLoss: { type: number }
            maxProfit: { type: number }
            breakEven: { type: number }
        rule: { type: string }
    BrokerPosition:
      type: object
      description: Posición tal como la reporta el broker; los campos no reportados quedan en null.
      properties:
        broker: { type: string }
        symbol: { type: string }
        instrumentType: { type: string, nullable: true, description: 'Tipo reportado (EQUITY u OPTION); en Webull las estrategias como COVERED_STOCK se reportan como OPTION' }
        optionStrategy: { type: string, nullable: true }
        qty: { type: number, nullable: true, description: Cantidad reportada (acciones, contratos o combinaciones según el instrumento) }
        equityQty: { type: number, nullable: true, description: Acciones de la posición; es lo único que cuenta para validar una venta de acciones }
        avgEntryPrice: { type: number, nullable: true }
        currentPrice: { type: number, nullable: true, description: Precio de mercado reportado; nunca el costo promedio }
        marketValue: { type: number, nullable: true }

    PayoffMatrixOutput:
      type: object
      properties:
        strategyId: { type: string, example: 'PORT-TECH-COLLAR-01' }
        symbol: { type: string, example: NVDA }
        spotPriceAtEntry: { type: number, example: 125.80 }
        sharesCount: { type: integer, example: 100 }
        breakeven: { type: number, example: 125.77 }
        floorPrice: { type: number, example: 119.50 }
        payoffMatrix:
          type: array
          items:
            type: object
            properties:
              spotAtExpiry: { type: number, example: 110.00 }
              stockPnL: { type: number, example: -1580.00 }
              optionsPnL: { type: number, example: 953.00 }
              netStrategyPnL: { type: number, example: -627.00 }
