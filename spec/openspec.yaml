openapi: 3.0.3
info:
  title: API REST Coberturas Cuantitativas de Opciones (Protective Put & Collar)
  version: 1.1.0
  description: >
    API RESTful con soporte de persistencia políglota dinámica (MongoDB Atlas y Supabase PostgreSQL),
    módulo cuantitativo F0 (Black-Scholes analítico, 5 Griegas, Newton-Raphson), módulo de coberturas
    F2 Parte B (Protective Put y Zero-Cost Collar con subdocumentos) e integración bursátil multi-broker
    en tiempo real con Webull OpenAPI y Alpaca Markets.
  contact:
    name: Equipo 1 - Los Eddies (Altamirano Plantillas Eddie David)
    email: ealtamirano@ittepic.edu.mx
servers:
  - url: http://localhost:3050/api/v1
    description: Servidor Local de Desarrollo

tags:
  - name: Core
    description: Verificación de estado del servidor y especificación de contratos
  - name: Autenticación
    description: Gestión de sesiones JWT y contexto de persistencia políglota
  - name: Subyacentes
    description: Catálogo y mantenimiento de activos subyacentes negociables
  - name: Coberturas
    description: Emisión, calibración algorítmica y gestión de estrategias Protective Put y Collar Spread
  - name: Subdocumentos
    description: Mutaciones atómicas sobre activos subyacentes embebidos y patas financieras (legs)
  - name: Métricas & Analítica
    description: Cálculo de sensibilidades griegas agregadas y matriz de pagos (Payoff Matrix)
  - name: Cuantitativo F0
    description: Motores cuantitativos analíticos de Black-Scholes y Newton-Raphson
  - name: Brokers Bursátiles
    description: Conexión multi-broker en tiempo real con Webull OpenAPI y Alpaca Markets (Paper Trading, feeds de cotización, cadena de opciones y enrutamiento de órdenes)

paths:
  # ==========================================================
  # 1. CORE & METADATOS
  # ==========================================================
  /:
    get:
      tags: [Core]
      summary: Inspección de estado raíz, telemetría institucional y base de datos activa
      responses:
        '200':
          description: Telemetría y enlaces de documentación del microservicio

  /spec.json:
    get:
      tags: [Core]
      summary: Especificación OpenAPI / OpenSpec cruda en formato JSON
      responses:
        '200':
          description: Documento OpenAPI 3.0 en JSON

  # ==========================================================
  # 2. AUTENTICACIÓN & SESIÓN
  # ==========================================================
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Inicio de sesión del inversor y selección de motor de persistencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, databaseTarget]
              properties:
                username: { type: string, example: eddie_investor }
                password: { type: string, example: SecurePass123! }
                databaseTarget: { type: string, enum: [mongodb, supabase], example: mongodb }
      responses:
        '200':
          description: Autenticación exitosa y token JWT emitido
        '401':
          description: Credenciales no autorizadas

  /auth/session:
    get:
      tags: [Autenticación]
      summary: Inspeccionar sesión y claims del token JWT activo
      responses:
        '200':
          description: Datos de sesión decodificados del usuario autenticado

  # ==========================================================
  # 3. SUBYACENTES
  # ==========================================================
  /underlyings:
    get:
      tags: [Subyacentes]
      summary: Listar catálogo completo de activos subyacentes
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase], default: mongodb }
      responses:
        '200':
          description: Lista de acciones y ETFs negociables
    post:
      tags: [Subyacentes]
      summary: Registrar un activo subyacente individual
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnderlyingInput'
      responses:
        '201':
          description: Subyacente registrado con éxito

  /underlyings/batch:
    post:
      tags: [Subyacentes]
      summary: Registrar múltiples subyacentes en lote masivo
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UnderlyingInput'
      responses:
        '201':
          description: Colección de subyacentes insertada

  /underlyings/symbol/{symbol}:
    get:
      tags: [Subyacentes]
      summary: Consultar activo subyacente por Ticker bursátil
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: AAPL }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Detalle del subyacente
        '404':
          description: Subyacente no encontrado

  /underlyings/{id}:
    get:
      tags: [Subyacentes]
      summary: Consultar subyacente por identificador primario
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Subyacente encontrado
        '404':
          description: No encontrado
    put:
      tags: [Subyacentes]
      summary: Actualizar precio spot o volatilidad del subyacente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spotPrice: { type: number, example: 230.15 }
                volatility: { type: number, example: 0.23 }
      responses:
        '200':
          description: Subyacente actualizado
    delete:
      tags: [Subyacentes]
      summary: Borrado lógico o físico del subyacente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Subyacente eliminado

  # ==========================================================
  # 4. ESTRATEGIAS DE COBERTURA
  # ==========================================================
  /hedging:
    get:
      tags: [Coberturas]
      summary: Listar todas las estrategias de cobertura registradas
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Lista de estrategias de cobertura activas

  /hedging/recommend-option/{symbol}:
    get:
      tags: [Coberturas]
      summary: Recomendar algorítmicamente la opción óptima (PUT o CALL) según Black-Scholes y mercado real
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: NVDA }
          description: Símbolo del activo subyacente
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [PUT, CALL], default: PUT }
          description: Tipo de opción a recomendar (PUT para cobertura de piso o CALL para techo de financiamiento)
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
          description: Broker bursátil para consultar cotizaciones y cadena de opciones real (WEBULL o ALPACA)
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
          description: Broker bursátil alternativo por query param
        - in: query
          name: expiration
          schema: { type: string, example: '2026-10-16' }
          description: Fecha de vencimiento de las opciones
        - in: query
          name: moneyness
          schema: { type: string, enum: [OTM, ATM, ITM], default: OTM }
          description: Grado de moneyness deseado (por defecto OTM)
      responses:
        '200':
          description: Contrato de opción óptimo recomendado con griegas calculadas y justificación analítica

  /hedging/auto-collar:
    post:
      tags: [Coberturas]
      summary: Calibrar y emitir automáticamente una cobertura Zero-Cost Collar
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
          description: Broker bursátil para consultar cotizaciones y primas (WEBULL o ALPACA)
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: executeOrders
          schema: { type: boolean, default: false, example: true }
          description: Si es true, emite automáticamente las órdenes bursátiles de las opciones al broker seleccionado (Webull o Alpaca)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, sharesCount]
              properties:
                broker: { type: string, enum: [WEBULL, ALPACA], default: WEBULL, example: WEBULL }
                symbol: { type: string, example: AAPL }
                sharesCount: { type: integer, example: 100 }
                protectionPct: { type: number, example: 0.05 }
                expirationDate: { type: string, example: '2026-10-16' }
                executeOrders: { type: boolean, default: false, example: true, description: 'Si es true, emite las órdenes bursátiles de las opciones al broker (Webull o Alpaca) de inmediato para que se reflejen en la terminal' }
      responses:
        '201':
          description: Cobertura Collar calibrada, persistida y opcionalmente emitida al broker

  /hedging/auto-collar/{symbol}:
    post:
      tags: [Coberturas]
      summary: Calibrar y emitir automáticamente un Collar Spread por símbolo en URL
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: NVDA }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: executeOrders
          schema: { type: boolean, default: false, example: true }
          description: Si es true, emite automáticamente las órdenes bursátiles al broker seleccionado
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sharesCount: { type: integer, default: 100, example: 100, description: Cantidad de acciones a cubrir (por defecto 100, 1 contrato) }
                expirationDate: { type: string, example: '2026-10-16', description: Fecha de vencimiento de las opciones }
                broker: { type: string, enum: [WEBULL, ALPACA], default: WEBULL, example: WEBULL }
                executeOrders: { type: boolean, default: false, example: true, description: 'Si es true, emite las órdenes bursátiles al broker de inmediato' }
      responses:
        '201':
          description: Cobertura Collar emitida automáticamente y opcionalmente enviada al broker

  /hedging/protective-put:
    post:
      tags: [Coberturas]
      summary: Estructurar y emitir cobertura Protective Put (F2 Parte B)
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, spotPrice, sharesCount, putStrike, putPremium]
              properties:
                portfolioId: { type: string, example: PORT-ALPHA-01 }
                broker: { type: string, enum: [ALPACA, WEBULL, IBKR, SIMULATED], default: WEBULL, example: WEBULL }
                symbol: { type: string, example: AAPL }
                spotPrice: { type: number, example: 228.50 }
                sharesCount: { type: integer, example: 100 }
                putStrike: { type: number, example: 220.00 }
                putPremium: { type: number, example: 4.20 }
                expirationDate: { type: string, format: date-time, example: '2026-10-16T00:00:00Z' }
      responses:
        '201':
          description: Cobertura Protective Put emitida con suelo blindado

  /hedging/collar-spread:
    post:
      tags: [Coberturas]
      summary: Estructurar y emitir cobertura Zero-Cost Collar (F2 Parte B)
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, spotPrice, sharesCount, putStrike, callStrike]
              properties:
                portfolioId: { type: string, example: PORT-ALPHA-01 }
                broker: { type: string, enum: [ALPACA, WEBULL, IBKR, SIMULATED], default: WEBULL, example: WEBULL }
                symbol: { type: string, example: SPY }
                spotPrice: { type: number, example: 565.00 }
                sharesCount: { type: integer, example: 100 }
                putStrike: { type: number, example: 550.00 }
                callStrike: { type: number, example: 580.00 }
                putPremium: { type: number, example: 6.50 }
                callPremium: { type: number, example: 6.60 }
      responses:
        '201':
          description: Cobertura Collar Spread creada con túnel de costo cero

  /hedging/batch:
    post:
      tags: [Coberturas]
      summary: Creación masiva por lote de estrategias de cobertura
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [symbol, strategyType]
                properties:
                  symbol: { type: string, example: AAPL }
                  strategyType: { type: string, enum: [PROTECTIVE_PUT, COLLAR_SPREAD] }
      responses:
        '201':
          description: Lote de coberturas emitido

  /hedging/{id}:
    get:
      tags: [Coberturas]
      summary: Consultar estrategia completa por ID con patas y métricas
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Estrategia encontrada
    delete:
      tags: [Coberturas]
      summary: Cerrar o eliminar estrategia de cobertura
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Estrategia cerrada

  /hedging/{id}/status:
    put:
      tags: [Coberturas]
      summary: Actualizar estado operativo de la estrategia (ACTIVE, EXPIRED, CLOSED)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, EXPIRED, CLOSED], example: CLOSED }
      responses:
        '200':
          description: Estado actualizado exitosamente

  # ==========================================================
  # 5. SUBDOCUMENTOS EMBEBIDOS (UNDERLYING & LEGS)
  # ==========================================================
  /hedging/{id}/underlying:
    get:
      tags: [Subdocumentos]
      summary: Consultar subdocumento embebido del activo subyacente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Datos del activo subyacente embebido
    put:
      tags: [Subdocumentos]
      summary: Actualizar cotización spot del subdocumento subyacente embebido
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotPrice]
              properties:
                spotPrice: { type: number, example: 231.50 }
      responses:
        '200':
          description: Subdocumento underlying actualizado

  /hedging/{id}/legs:
    get:
      tags: [Subdocumentos]
      summary: Consultar todas las patas de opciones derivadas (subdocumento legs)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Arreglo de patas derivadas embebidas
    post:
      tags: [Subdocumentos]
      summary: Agregar una nueva pata individual a la estrategia
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegInput'
      responses:
        '201':
          description: Pata agregada exitosamente al subdocumento

  /hedging/{id}/legs/batch:
    post:
      tags: [Subdocumentos]
      summary: Agregar un lote masivo de patas a la estrategia
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LegInput'
      responses:
        '201':
          description: Lote de patas agregado exitosamente
    put:
      tags: [Subdocumentos]
      summary: Actualizar lote masivo de patas simultáneamente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [legId]
                properties:
                  legId: { type: string }
                  delta: { type: number }
                  entryPrice: { type: number }
      responses:
        '200':
          description: Lote de patas actualizado
    delete:
      tags: [Subdocumentos]
      summary: Eliminar múltiples patas financieras en bloque
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legIds]
              properties:
                legIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Patas eliminadas en bloque

  /hedging/{id}/legs/{legId}:
    get:
      tags: [Subdocumentos]
      summary: Consultar una pata de opción específica por ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: legId
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Detalle de la pata encontrada
    put:
      tags: [Subdocumentos]
      summary: Actualizar una pata de opción específica
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: legId
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strike: { type: number }
                entryPrice: { type: number }
                delta: { type: number }
      responses:
        '200':
          description: Pata actualizada
    delete:
      tags: [Subdocumentos]
      summary: Eliminar una pata de opción individual del arreglo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: legId
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Pata eliminada individualmente

  # ==========================================================
  # 6. MÉTRICAS FINANCIERAS & MATRIZ DE PAGOS
  # ==========================================================
  /hedging/{id}/financial-metrics:
    get:
      tags: [Métricas & Analítica]
      summary: Consultar métricas financieras y letras griegas agregadas
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Métricas financieras agregadas (Costo neto, Delta, Max Profit/Loss)

  /hedging/{id}/financial-metrics/recalculate:
    put:
      tags: [Métricas & Analítica]
      summary: Recalcular y persistir métricas cuantitativas y griegas agregadas
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Métricas recalculadas y actualizadas

  /hedging/{id}/payoff-matrix:
    get:
      tags: [Métricas & Analítica]
      summary: Generar matriz discreta de curvas de Payoff P&L para graficación interactiva
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: steps
          schema: { type: integer, default: 25 }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Puntos vectoriales simulados de P&L al vencimiento

  # ==========================================================
  # 7. MOTOR CUANTITATIVO F0
  # ==========================================================
  /quant/black-scholes:
    post:
      tags: [Cuantitativo F0]
      summary: Valuación analítica Black-Scholes y cálculo de 5 Griegas (F0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotPrice, strikePrice, timeToExpirationYears, optionType]
              properties:
                spotPrice: { type: number, example: 565.0 }
                strikePrice: { type: number, example: 550.0 }
                timeToExpirationYears: { type: number, example: 0.08 }
                volatility: { type: number, example: 0.15 }
                riskFreeRate: { type: number, example: 0.045 }
                optionType: { type: string, enum: [CALL, PUT], example: PUT }
      responses:
        '200':
          description: Precio teórico y telemetría analítica de Griegas

  /quant/implied-volatility:
    post:
      tags: [Cuantitativo F0]
      summary: Cálculo iterativo de Volatilidad Implícita con Newton-Raphson (F0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketPrice, spotPrice, strikePrice, timeToExpirationYears, optionType]
              properties:
                marketPrice: { type: number, example: 6.50 }
                spotPrice: { type: number, example: 565.0 }
                strikePrice: { type: number, example: 550.0 }
                timeToExpirationYears: { type: number, example: 0.08 }
                optionType: { type: string, enum: [CALL, PUT], example: PUT }
      responses:
        '200':
          description: Volatilidad implícita calculada con convergencia

  # ==========================================================
  # 8. BROKERS BURSÁTILES: WEBULL OPENAPI & ALPACA MARKETS
  # ==========================================================
  /broker/account:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar balance, capital y poder de compra del broker activo (Webull o Alpaca)
      parameters:
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
          description: Selección del broker para la consulta (por defecto WEBULL)
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
          description: Selección alternativa de broker por parámetro query
      responses:
        '200':
          description: Estado financiero de cuenta bursátil de Paper Trading

  /broker/positions:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar posiciones vivas abiertas en el broker activo
      parameters:
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      responses:
        '200':
          description: Cartera de acciones y contratos abiertos en el broker

  /broker/orders:
    get:
      tags: [Brokers Bursátiles]
      summary: Listar órdenes bursátiles ejecutadas o pendientes en el broker
      parameters:
        - in: query
          name: status
          schema: { type: string, default: all }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      responses:
        '200':
          description: Historial de órdenes bursátiles
    post:
      tags: [Brokers Bursátiles]
      summary: Emitir una nueva orden bursátil (mercado/límite) en Webull o Alpaca
      parameters:
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerOrderInput'
      responses:
        '201':
          description: Orden emitida y enviada a la rueda bursátil del broker

  /broker/orders/{id}:
    delete:
      tags: [Brokers Bursátiles]
      summary: Cancelar una orden bursátil abierta en el broker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      responses:
        '200':
          description: Orden cancelada exitosamente

  /broker/quote/{symbol}:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar cotización viva en tiempo real desde Webull o Alpaca
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: AAPL }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      responses:
        '200':
          description: Cotización viva (bid, ask, lastPrice)

  /broker/options-chain/{symbol}:
    get:
      tags: [Brokers Bursátiles]
      summary: Consultar cadena de opciones viva (Option Chain) para calibración de coberturas
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: SPY }
        - in: query
          name: expiration
          schema: { type: string, example: '2026-10-16' }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      responses:
        '200':
          description: Cadena de contratos Call y Put

  /broker/sync-underlying/{symbol}:
    post:
      tags: [Brokers Bursátiles]
      summary: Sincronizar y actualizar precio spot del subyacente en BD con datos del Broker
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: GOOGL }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase], default: mongodb }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA], default: WEBULL }
      responses:
        '200':
          description: Subyacente sincronizado en la base de datos seleccionada con el broker activo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer JWT emitido en /auth/login con claims de usuario, rol y motor de base de datos activa (dbTarget).

  schemas:
    UnderlyingInput:
      type: object
      required: [symbol, companyName, spotPrice]
      properties:
        symbol: { type: string, example: NVDA }
        companyName: { type: string, example: NVIDIA Corporation }
        spotPrice: { type: number, example: 125.80 }
        volatility: { type: number, example: 0.45 }

    Underlying:
      type: object
      required: [symbol, companyName, spotPrice, volatility]
      properties:
        id: { type: string, example: '67035ab218ef8c12e4f09999' }
        symbol: { type: string, example: AAPL }
        companyName: { type: string, example: Apple Inc. }
        spotPrice: { type: number, example: 228.52 }
        volatility: { type: number, example: 0.2450 }
        createdAt: { type: string, format: date-time, example: '2026-10-10T12:00:00Z' }
        updatedAt: { type: string, format: date-time, example: '2026-10-10T14:30:00Z' }

    LegInput:
      type: object
      required: [legRole, assetType, quantity, entryPrice]
      properties:
        legRole: { type: string, enum: [UNDERLYING, HEDGE_FLOOR, FINANCE_CEILING, STOCK, LONG_PUT, SHORT_CALL], example: HEDGE_FLOOR }
        assetType: { type: string, enum: [EQUITY, OPTION], example: OPTION }
        optionType: { type: string, enum: [CALL, PUT, null], example: PUT }
        strike: { type: number, example: 220.0 }
        quantity: { type: integer, example: 1 }
        entryPrice: { type: number, example: 4.20 }

    OptionLeg:
      type: object
      required: [legId, legRole, assetType, quantity, entryPrice]
      properties:
        legId: { type: string, example: 'LEG-PUT-FLOOR-01' }
        legRole:
          type: string
          enum: [UNDERLYING, HEDGE_FLOOR, FINANCE_CEILING, STOCK, LONG_PUT, SHORT_CALL]
          example: HEDGE_FLOOR
        assetType:
          type: string
          enum: [EQUITY, OPTION]
          example: OPTION
        contractSymbol: { type: string, example: 'NVDA261016P00119500' }
        optionType:
          type: string
          enum: [CALL, PUT, null]
          example: PUT
        strike: { type: number, example: 119.50 }
        expirationDate: { type: string, format: date-time, example: '2026-10-16T00:00:00Z' }
        quantity: { type: integer, example: 1 }
        entryPrice: { type: number, example: 2.15 }
        delta: { type: number, example: -0.2105 }
        gamma: { type: number, example: 0.0340 }
        theta: { type: number, example: -0.0450 }
        vega: { type: number, example: 0.1250 }

    UnderlyingSubdocument:
      type: object
      required: [symbol, companyName, spotPriceAtEntry, sharesCount]
      properties:
        symbol: { type: string, example: NVDA }
        companyName: { type: string, example: NVIDIA Corporation }
        spotPriceAtEntry: { type: number, example: 125.80 }
        sharesCount: { type: integer, example: 100 }

    FinancialMetricsSubdocument:
      type: object
      required: [netDebitCredit, breakevenPrice, floorProtectionPrice, maxLossTotalUSD]
      properties:
        netDebitCredit: { type: number, example: 3.00, description: 'Crédito (+) o Débito (-) neto en USD de primas' }
        breakevenPrice: { type: number, example: 125.77, description: 'Precio de equilibrio a vencimiento' }
        floorProtectionPrice: { type: number, example: 119.50, description: 'Suelo mínimo blindado garantizado por el Put' }
        ceilingCapPrice: { type: number, example: 135.00, description: 'Techo máximo de ganancias fijado por el Short Call' }
        maxLossTotalUSD: { type: number, example: 627.00, description: 'Pérdida máxima acotada en USD' }
        maxProfitTotalUSD: { type: number, example: 923.00, description: 'Beneficio máximo acotado en USD' }
        netDelta: { type: number, example: 0.5655, description: 'Delta neta agregada de la posición cubierta' }

    HedgingStrategy:
      type: object
      required: [_id, portfolioId, broker, strategyType, status, underlying, legs, financialMetrics]
      properties:
        _id: { type: string, example: '67035ab218ef8c12e4f01234' }
        id: { type: string, example: '67035ab218ef8c12e4f01234' }
        portfolioId: { type: string, example: 'PORT-TECH-COLLAR-01' }
        broker:
          type: string
          enum: [ALPACA, IBKR, WEBULL, SIMULATED]
          default: ALPACA
          example: ALPACA
          description: Broker bursátil donde opera o se liquida la estrategia de cobertura
        strategyType:
          type: string
          enum: [PROTECTIVE_PUT, COLLAR, COLLAR_SPREAD]
          example: COLLAR
        status:
          type: string
          enum: [ACTIVE, CLOSED, EXPIRED, EXERCISED]
          default: ACTIVE
          example: ACTIVE
        underlying:
          $ref: '#/components/schemas/UnderlyingSubdocument'
        legs:
          type: array
          items:
            $ref: '#/components/schemas/OptionLeg'
        financialMetrics:
          $ref: '#/components/schemas/FinancialMetricsSubdocument'
        createdAt: { type: string, format: date-time, example: '2026-10-10T14:30:00Z' }
        updatedAt: { type: string, format: date-time, example: '2026-10-10T14:30:00Z' }

    BlackScholesInput:
      type: object
      required: [spotPrice, strikePrice, timeToExpirationYears, volatility, riskFreeRate, optionType]
      properties:
        spotPrice: { type: number, example: 228.50 }
        strikePrice: { type: number, example: 220.00 }
        timeToExpirationYears: { type: number, example: 0.0822 }
        volatility: { type: number, example: 0.25 }
        riskFreeRate: { type: number, example: 0.045 }
        optionType: { type: string, enum: [CALL, PUT], example: PUT }

    BlackScholesOutput:
      type: object
      properties:
        theoreticalPrice: { type: number, example: 2.15 }
        d1: { type: number, example: 0.6543 }
        d2: { type: number, example: 0.5824 }
        greeks:
          type: object
          properties:
            delta: { type: number, example: -0.2105 }
            gamma: { type: number, example: 0.0340 }
            theta: { type: number, example: -0.0450 }
            vega: { type: number, example: 0.1250 }
            rho: { type: number, example: -0.0150 }

    ImpliedVolatilityInput:
      type: object
      required: [marketPrice, spotPrice, strikePrice, timeToExpirationYears, riskFreeRate, optionType]
      properties:
        marketPrice: { type: number, example: 2.15 }
        spotPrice: { type: number, example: 228.50 }
        strikePrice: { type: number, example: 220.00 }
        timeToExpirationYears: { type: number, example: 0.0822 }
        riskFreeRate: { type: number, example: 0.045 }
        optionType: { type: string, enum: [CALL, PUT], example: PUT }

    ImpliedVolatilityOutput:
      type: object
      properties:
        impliedVolatility: { type: number, example: 0.2485 }
        iterations: { type: integer, example: 3 }
        converged: { type: boolean, example: true }

    BrokerOrderInput:
      type: object
      required: [symbol, qty, side, type]
      properties:
        broker: { type: string, enum: [WEBULL, ALPACA], default: WEBULL, example: WEBULL }
        symbol: { type: string, example: AAPL }
        instrumentType: { type: string, enum: [EQUITY, OPTION], default: EQUITY, example: OPTION }
        optionType: { type: string, enum: [CALL, PUT], description: Requerido si instrumentType es OPTION, example: CALL }
        strikePrice: { type: number, description: Precio de ejercicio para opciones, example: 235.00 }
        expirationDate: { type: string, description: Fecha de vencimiento para opciones (YYYY-MM-DD), example: '2026-10-16' }
        qty: { type: integer, example: 10 }
        side: { type: string, enum: [buy, sell], example: buy }
        type: { type: string, enum: [market, limit], default: limit, example: limit }
        timeInForce: { type: string, enum: [day, gtc], default: gtc, example: gtc }
        limitPrice: { type: number, example: 228.00 }

    BrokerOrderOutput:
      type: object
      properties:
        broker: { type: string, enum: [WEBULL, ALPACA], example: WEBULL }
        orderId: { type: string, example: '904837cc-ae9b-4b1a-8c02-5aed3245b3d7' }
        clientOrderId: { type: string, example: 'ORD-982173' }
        symbol: { type: string, example: AAPL }
        qty: { type: integer, example: 10 }
        side: { type: string, example: buy }
        status: { type: string, example: accepted }
        createdAt: { type: string, format: date-time }

    PayoffMatrixOutput:
      type: object
      properties:
        strategyId: { type: string, example: 'PORT-TECH-COLLAR-01' }
        symbol: { type: string, example: NVDA }
        spotPriceAtEntry: { type: number, example: 125.80 }
        sharesCount: { type: integer, example: 100 }
        breakeven: { type: number, example: 125.77 }
        floorPrice: { type: number, example: 119.50 }
        payoffMatrix:
          type: array
          items:
            type: object
            properties:
              spotAtExpiry: { type: number, example: 110.00 }
              stockPnL: { type: number, example: -1580.00 }
              optionsPnL: { type: number, example: 953.00 }
              netStrategyPnL: { type: number, example: -627.00 }
