openapi: 3.0.3
info:
  title: API REST Coberturas Cuantitativas de Opciones (Protective Put & Collar)
  version: 1.1.0
  description: >
    API RESTful con soporte de persistencia políglota dinámica (MongoDB Atlas y Supabase PostgreSQL),
    módulo cuantitativo F0 (Black-Scholes analítico, 5 Griegas, Newton-Raphson), módulo de coberturas
    F2 Parte B (Protective Put y Zero-Cost Collar con subdocumentos) e integración bursátil multi-broker
    en tiempo real con Webull OpenAPI, Alpaca Markets e Interactive Brokers (TWS Socket).

    REGLA DE SINCRONIZACIÓN CONTINUA DE CLIENTES (POSTMAN / OPENSPEC):
    Ante cualquier adición, modificación o recalibración en los contratos de la API (rutas, parámetros,
    encabezados o modelos de carga útil), es OBLIGATORIO regenerar y sincronizar simultáneamente el archivo
    de colección de pruebas exportable para Postman (LSW_Cloudflare_Postman_Collection.json)
    a través del script automatizado scripts/build_full_postman_collection.py, garantizando paridad total
    entre la especificación OpenSpec, el código ejecutable y las pruebas de los clientes.

    POLÍTICA ESTRICTA DE OPERACIÓN BURSÁTIL REAL (CERO SIMULACIÓN):
    El microservicio opera única y exclusivamente con brokers bursátiles reales (Alpaca Markets, Webull OpenAPI
    e Interactive Brokers TWS) y fuentes institucionales (SEC EDGAR). Queda estrictamente prohibida la introducción
    o persistencia de brokers ficticios ('SIMULATED'), snapshots estáticos con jitter sintético o cuentas virtuales
    con saldos inventados. Si un broker o fuente bursátil no responde o está desconectado, el microservicio
    aplica una política fail-fast devolviendo un código de error HTTP 502/503 claro y verificable.
  contact:
    name: Equipo 1 - Los Eddies (Altamirano Plantillas Eddie David)
    email: ealtamirano@ittepic.edu.mx
servers:
  - url: https://consist-overall-leaders-supplement.trycloudflare.com/api/v1
    description: Túnel Cloudflare Público (Acceso Remoto para Postman y Evaluadores)
  - url: http://localhost:3050/api/v1
    description: Servidor Local de Desarrollo

tags:
  - name: Core
    description: Verificación de estado del servidor y especificación de contratos
  - name: Autenticación
    description: Gestión de sesiones JWT y contexto de persistencia políglota
  - name: Subyacentes
    description: Catálogo y mantenimiento de activos subyacentes negociables
  - name: Coberturas
    description: Emisión, calibración algorítmica y gestión de estrategias Protective Put y Collar Spread
  - name: Subdocumentos
    description: Mutaciones atómicas sobre activos subyacentes embebidos y patas financieras (legs)
  - name: Métricas & Analítica
    description: Cálculo de sensibilidades griegas agregadas y matriz de pagos (Payoff Matrix)
  - name: Cuantitativo F0
    description: Motores cuantitativos analíticos de Black-Scholes y Newton-Raphson
  - name: Brokers Bursátiles
    description: Conexión multi-broker en tiempo real con Webull OpenAPI, Alpaca Markets e Interactive Brokers (TWS Socket) (Paper Trading, feeds de cotización, cadena de opciones y enrutamiento de órdenes)
  - name: Screener & TradingView
    description: Motor algorítmico de selección de empresas Top 5 / Top 10 y widgets de TradingView (API v2)

paths:
  # ==========================================================
  # 1. CORE & METADATOS
  # ==========================================================
  /:
    get:
      tags: [Core]
      summary: Inspección de estado raíz, telemetría institucional y base de datos activa
      responses:
        '200':
          description: Telemetría y enlaces de documentación del microservicio

  /spec.json:
    get:
      tags: [Core]
      summary: Especificación OpenAPI / OpenSpec cruda en formato JSON
      responses:
        '200':
          description: Documento OpenAPI 3.0 en JSON

  # ==========================================================
  # 2. AUTENTICACIÓN & SESIÓN
  # ==========================================================
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Inicio de sesión del inversor y selección de motor de persistencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, databaseTarget]
              properties:
                username: { type: string, example: eddie_investor }
                password: { type: string, example: SecurePass123! }
                databaseTarget: { type: string, enum: [mongodb, supabase], example: mongodb }
      responses:
        '200':
          description: Autenticación exitosa y token JWT emitido
        '401':
          description: Credenciales no autorizadas

  /auth/session:
    get:
      tags: [Autenticación]
      summary: Inspeccionar sesión y claims del token JWT activo
      responses:
        '200':
          description: Datos de sesión decodificados del usuario autenticado

  # ==========================================================
  # 3. SUBYACENTES
  # ==========================================================
  /underlyings:
    get:
      tags: [Subyacentes]
      summary: Listar catálogo completo de activos subyacentes
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase], default: mongodb }
      responses:
        '200':
          description: Lista de acciones y ETFs negociables
    post:
      tags: [Subyacentes]
      summary: Registrar un activo subyacente individual
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnderlyingInput'
      responses:
        '201':
          description: Subyacente registrado con éxito

  /underlyings/batch:
    post:
      tags: [Subyacentes]
      summary: Registrar múltiples subyacentes en lote masivo
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UnderlyingInput'
      responses:
        '201':
          description: Colección de subyacentes insertada

  /underlyings/symbol/{symbol}:
    get:
      tags: [Subyacentes]
      summary: Consultar activo subyacente por Ticker bursátil
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: AAPL }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Detalle del subyacente
        '404':
          description: Subyacente no encontrado

  /underlyings/{id}:
    get:
      tags: [Subyacentes]
      summary: Consultar subyacente por identificador primario
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Subyacente encontrado
        '404':
          description: No encontrado
    put:
      tags: [Subyacentes]
      summary: Actualizar precio spot o volatilidad del subyacente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spotPrice: { type: number, example: 230.15 }
                volatility: { type: number, example: 0.23 }
      responses:
        '200':
          description: Subyacente actualizado
    delete:
      tags: [Subyacentes]
      summary: Borrado lógico o físico del subyacente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Subyacente eliminado

  # ==========================================================
  # 4. ESTRATEGIAS DE COBERTURA
  # ==========================================================
  /hedging:
    get:
      tags: [Coberturas]
      summary: Listar todas las estrategias de cobertura registradas
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Lista de estrategias de cobertura activas

  /hedging/recommend-option/{symbol}:
    get:
      tags: [Coberturas]
      summary: Recomendar un contrato PUT o CALL listado, con su cotización observada (sin emitir órdenes)
      description: >
        Elige entre contratos listados y líquidos (regla del Core 004) de la cadena real: contratos de Alpaca con
        cotizaciones de Webull OpenAPI. No calcula primas; devuelve bid, ask, instante, retraso y fuente.
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: NVDA }
          description: Símbolo del activo subyacente
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [PUT, CALL], default: PUT }
          description: Tipo de opción a recomendar (PUT para cobertura de piso o CALL para techo de financiamiento)
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
          description: Broker bursátil para consultar cotizaciones y cadena de opciones real (WEBULL, ALPACA o IBKR)
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
          description: Broker bursátil alternativo por query param
        - in: query
          name: expiration
          schema: { type: string, example: '2026-10-16' }
          description: Fecha de vencimiento de las opciones
        - in: query
          name: moneyness
          schema: { type: string, enum: [OTM, ATM, ITM], default: OTM }
          description: Grado de moneyness deseado (por defecto OTM)
      responses:
        '200':
          description: Contrato recomendado (recommendedContract) y hasta tres candidatos, cada uno con su cotización
          content:
            application/json:
              schema:
                type: object
                properties:
                  spotPrice: { type: number }
                  spotTime: { type: string, nullable: true }
                  recommendedContract: { $ref: '#/components/schemas/ContratoOpcionCotizado' }
                  topCandidates: { type: array, items: { $ref: '#/components/schemas/ContratoOpcionCotizado' } }
        '400':
          description: Tipo, moneyness o vencimiento inválidos
        '503':
          description: No hay contratos cotizados del tipo pedido, o el proveedor de cotizaciones no respondió

  /hedging/auto-collar:
    post:
      tags: [Coberturas]
      summary: Previsualizar (por defecto) o emitir el collar que selecciona el Core 004 sobre la cadena real
      description: >
        Con executeOrders ausente o false devuelve una vista previa (campo preview) con el Put y el Call que elige el
        Core 004, sus cotizaciones y métricas, sin emitir órdenes ni guardar registros (200). Con executeOrders true
        emite las órdenes y guarda la estrategia (201).
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
          description: Broker bursátil para consultar cotizaciones y primas (WEBULL, ALPACA o IBKR)
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: executeOrders
          schema: { type: boolean, default: false, example: true }
          description: Si es true, emite automáticamente las órdenes bursátiles de las opciones al broker seleccionado (Webull o Alpaca)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, sharesCount]
              properties:
                broker: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL, example: WEBULL }
                symbol: { type: string, example: AAPL }
                sharesCount: { type: integer, example: 100, default: 100, description: 'Múltiplo de 100: se compran contratos × 100 acciones para cubrir cada Call' }
                putContractSymbol: { type: string, example: AAPL261231P00330000, description: Put del collar del ranking (Core 004); se vuelve a cotizar }
                callContractSymbol: { type: string, example: AAPL261231C00360000, description: Call del collar del ranking (Core 004); se vuelve a cotizar }
                protectionPct: { type: number, example: 0.05 }
                expirationDate: { type: string, example: '2026-10-16' }
                executeOrders: { type: boolean, default: false, example: true, description: 'Si es true, emite las órdenes bursátiles de las opciones al broker (Webull o Alpaca) de inmediato para que se reflejen en la terminal' }
      responses:
        '200':
          description: Vista previa sin órdenes ni registros
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview: { $ref: '#/components/schemas/VistaPreviaCollar' }
                  strategy: { type: object, nullable: true }
        '201':
          description: Órdenes aceptadas (primero el Put; en Webull, después el COVERED_STOCK con límite neto acciones − bid del Call) y estrategia ACTIVE
        '400':
          description: sharesCount que no es múltiplo de 100, collar del ranking que ya no es apto, o rechazo del broker sin patas vivas (no se guarda)
        '409':
          description: >
            Ejecución parcial: falló una pata después de que otra quedó viva o ejecutada (o con una cancelación no
            confirmada). Se guarda la estrategia como PARTIALLY_EXECUTED; el cuerpo trae orders (identificador, estado,
            cantidad ejecutada, mensaje del broker y cancelación de cada pata), failure y strategy.
        '503':
          description: Sin cadena real (no hay contratos cotizados o el proveedor no respondió)

  /hedging/auto-collar/{symbol}:
    post:
      tags: [Coberturas]
      summary: Calibrar y emitir automáticamente un Collar Spread por símbolo en URL
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, example: NVDA }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: broker
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
        - in: query
          name: executeOrders
          schema: { type: boolean, default: false, example: true }
          description: Si es true, emite automáticamente las órdenes bursátiles al broker seleccionado
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sharesCount: { type: integer, default: 100, example: 100, description: Cantidad de acciones a cubrir (por defecto 100, 1 contrato) }
                expirationDate: { type: string, example: '2026-10-16', description: Fecha de vencimiento de las opciones }
                broker: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL, example: WEBULL }
                executeOrders: { type: boolean, default: false, example: true, description: 'Si es true, emite las órdenes bursátiles al broker de inmediato' }
      responses:
        '201':
          description: Cobertura Collar emitida automáticamente y ejecutada en vivo
        '400':
          description: Error de parámetros o poder de compra (Buying Power) insuficiente en el broker
        '503':
          description: Falla de ejecución en vivo en el broker o túnel desconectado

  /hedging/protective-put:
    post:
      tags: [Coberturas]
      summary: Estructurar y emitir cobertura Protective Put con validación de Buying Power y ejecución en vivo (F2 Parte B)
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
        - in: header
          name: x-broker-selection
          schema: { type: string, enum: [WEBULL, ALPACA, IBKR], default: WEBULL }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, sharesCount]
              description: >
                Con executeOrders true se usa el Put de contractSymbol o, si falta, el strike listado más cercano menor o
                igual a putStrike para expirationDate. Los límites son el ask observado del Put y el ask de las acciones al
                ejecutar; putPremium y spotPrice no se usan como límite. Sin executeOrders, registra la cobertura indicada
                (exige putStrike, putPremium y expirationDate).
              properties:
                portfolioId: { type: string, example: PORT-ALPHA-01 }
                broker: { type: string, enum: [ALPACA, WEBULL, IBKR], default: WEBULL, example: WEBULL }
                symbol: { type: string, example: AAPL }
                contractSymbol: { type: string, example: AAPL261218P00215000, description: Put listado a usar (el de la vista previa) }
                spotPrice: { type: number, example: 228.50, description: Solo para el registro sin ejecución }
                sharesCount: { type: integer, example: 100, description: 'Se compran ceil(sharesCount / 100) contratos' }
                putStrike: { type: number, example: 220.00 }
                putPremium: { type: number, example: 4.20, description: Solo para el registro sin ejecución; no es el precio límite }
                expirationDate: { type: string, format: date-time, example: '2026-10-16T00:00:00Z' }
                executeOrders: { type: boolean, default: true, description: Indica si se emiten las órdenes en tiempo real al broker }
                buyUnderlying: { type: boolean, default: true, description: Indica si se compran las acciones o si ya se poseen en cartera }
      responses:
        '201':
          description: Órdenes aceptadas por el broker (primero el Put, después las acciones) y estrategia guardada como ACTIVE, con el estado de cada orden
        '400':
          description: >
            Validación, strike sin Put listado, Buying Power insuficiente o rechazo del broker. Si una pata aceptada se
            canceló con confirmación, nada quedó vivo y no se guarda; el cuerpo trae orders.
        '409':
          description: >
            Ejecución parcial: falló una pata después de que otra quedó viva o ejecutada (o con una cancelación no
            confirmada). Se guarda la estrategia como PARTIALLY_EXECUTED; el cuerpo trae orders (identificador, estado,
            cantidad ejecutada, mensaje del broker y cancelación de cada pata), failure y strategy.
        '503':
          description: Sin cotización observada vigente del Put o de las acciones, o el broker no respondió; no se envían órdenes

  /hedging/collar-spread:
    post:
      tags: [Coberturas]
      summary: Estructurar y emitir cobertura Zero-Cost Collar (F2 Parte B)
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, sharesCount, putStrike, callStrike, putPremium, callPremium, expirationDate]
              description: Registro manual de un collar; las primas son obligatorias (sin valores predeterminados) y el símbolo OCC usa el vencimiento indicado.
              properties:
                portfolioId: { type: string, example: PORT-ALPHA-01 }
                broker: { type: string, enum: [ALPACA, WEBULL, IBKR], default: WEBULL, example: WEBULL }
                symbol: { type: string, example: SPY }
                expirationDate: { type: string, format: date, example: '2026-12-18' }
                spotPrice: { type: number, example: 565.00 }
                sharesCount: { type: integer, example: 100 }
                putStrike: { type: number, example: 550.00 }
                callStrike: { type: number, example: 580.00 }
                putPremium: { type: number, example: 6.50 }
                callPremium: { type: number, example: 6.60 }
      responses:
        '201':
          description: Collar registrado
        '400':
          description: Faltan las primas, los strikes o el vencimiento, o los strikes no quedan fuera del dinero

  /hedging/batch:
    post:
      tags: [Coberturas]
      summary: Creación masiva por lote de estrategias de cobertura
      parameters:
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [symbol, strategyType]
                properties:
                  symbol: { type: string, example: AAPL }
                  strategyType: { type: string, enum: [PROTECTIVE_PUT, COLLAR_SPREAD] }
      responses:
        '201':
          description: Lote de coberturas emitido

  /hedging/{id}:
    get:
      tags: [Coberturas]
      summary: Consultar estrategia completa por ID con patas y métricas
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Estrategia encontrada
    delete:
      tags: [Coberturas]
      summary: Cerrar o eliminar estrategia de cobertura
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Estrategia cerrada

  /hedging/{id}/status:
    put:
      tags: [Coberturas]
      summary: Actualizar estado operativo de la estrategia (ACTIVE, EXPIRED, CLOSED)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, EXPIRED, CLOSED], example: CLOSED }
      responses:
        '200':
          description: Estado actualizado exitosamente

  # ==========================================================
  # 5. SUBDOCUMENTOS EMBEBIDOS (UNDERLYING & LEGS)
  # ==========================================================
  /hedging/{id}/underlying:
    get:
      tags: [Subdocumentos]
      summary: Consultar subdocumento embebido del activo subyacente
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Datos del activo subyacente embebido
    put:
      tags: [Subdocumentos]
      summary: Actualizar cotización spot del subdocumento subyacente embebido
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotPrice]
              properties:
                spotPrice: { type: number, example: 231.50 }
      responses:
        '200':
          description: Subdocumento underlying actualizado

  /hedging/{id}/legs:
    get:
      tags: [Subdocumentos]
      summary: Consultar todas las patas de opciones derivadas (subdocumento legs)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      responses:
        '200':
          description: Arreglo de patas derivadas embebidas
    post:
      tags: [Subdocumentos]
      summary: Agregar una nueva pata individual a la estrategia
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: x-database-selection
          schema: { type: string, enum: [mongodb, supabase] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegInput'
      responses:
        '201':
          description: Pata agregada exitosamente al subdocumento

  /hedging/{id}/legs/batch:
    post:
      tags: [Subdocumentos]
      summary: Agregar un lote masivo de patas a la estrategia
      parameters:
        - in: path
